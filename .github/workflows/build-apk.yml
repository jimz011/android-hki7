name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release-tag, f.eks. hki7-v1.1.2-1"
        required: true
        type: string
  push:
    tags:
      - "hki7-v*"

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 preview SDK
        run: |
          sdkmanager --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

      - name: Read app version
        id: version
        run: |
          NAME=$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path("app/build.gradle.kts").read_text()
          match = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          print(match.group(1) if match else "dev")
          PY
          )
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: rel
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            hki7-v*) ;;
            *) echo "Tag must look like hki7-v1.1.2-1, got: $TAG" >&2; exit 1 ;;
          esac
          SHORT="${TAG#hki7-}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=HKI7-${SHORT}.apk" >> "$GITHUB_OUTPUT"
          echo "title=HKI 7 ${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Prepare release file
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/${{ steps.rel.outputs.apk }}"
          ls -la release

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: HKI7-debug-apk
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.title }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            Installerbar test-APK av HKI 7.

            - Tag: **${{ steps.rel.outputs.tag }}**
            - App-versjon: **${{ steps.version.outputs.name }}**
            - Commit: `${{ github.sha }}`
            - Krever Android 12 eller nyere (minSdk 31)
            - Signert med standard Android debug-nøkkel
          files: release/*.apk
          fail_on_unmatched_files: true
