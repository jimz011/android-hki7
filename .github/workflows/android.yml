name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install project SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile phone and watch, run regression tests
        run: bash ./gradlew :app:testDebugUnitTest :core:testDebugUnitTest :wear:testDebugUnitTest --stacktrace
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            app/build/reports/tests/
            core/build/reports/tests/
            wear/build/reports/tests/
          if-no-files-found: ignore
